# Test configuration: scheduled triggers stay off, so a run at 23:00 can never touch an integration-test database.
# Tests call RenewalScheduler directly on a fixed clock instead (AC-07.1).
policyforge.scheduling.enabled=false

# The admin renewal-cycle job accepts only today - 30 .. today in production (AC-07.8). The integration tests move a
# fixed clock and run the job for dates around it, so the test configuration lifts the bound. RenewalJobDateBoundIT
# turns it off again to prove the bound.
policyforge.jobs.renewal-cycle.any-date=true

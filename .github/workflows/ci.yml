# CI for pushes to dev and main and for pull requests into them (NFR-09.1 to NFR-09.3, NFR-09.6).
# .gitlab-ci.yml runs the same five jobs with the same commands. Every action is pinned to a full commit SHA, every
# image to a tag and digest (NFR-09.2). Job names equal their IDs so that the check names stay stable.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Read-only by default. Only claude-review widens this, on its own job.
permissions:
  contents: read

# A newer run of the same pull request cancels the older one. A push to dev or main has a group of its own and is never
# cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.13+9
          cache: maven
      - name: Cache the npm download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Verify the backend and package the SPA
        run: cd backend && ./mvnw -B verify
      - name: Upload the packaged JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policyforge-jar
          path: backend/target/policyforge-*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Upload the JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the surefire and failsafe reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test with coverage and build
        run: cd frontend && npm ci && npm test && npm run build
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The image carries the browsers that match the locked @playwright/test. The app is the JAR of the build job.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the packaged JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: policyforge-jar
          path: policyforge-jar
      - name: Set up a Temurin 21 JRE
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.13+9
          java-package: jre
      - name: Cache the npm download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Point PF_E2E_JAR at the packaged JAR
        run: |
          jars=(policyforge-jar/policyforge-*.jar)
          test "${#jars[@]}" -eq 1
          echo "PF_E2E_JAR=$PWD/${jars[0]}" >> "$GITHUB_ENV"
      - name: Run Playwright on both projects
        run: cd frontend && npm ci && npx playwright test
      - name: List the visual assertions that were skipped
        if: always()
        run: |
          file=frontend/test-results/visual-baselines-missing.txt
          if [ -f "$file" ]; then
            count="$(wc -l < "$file")"
            echo "visual-baseline-missing: $count visual assertion(s) skipped, this platform has no baselines yet"
            cat "$file"
            {
              echo "### Visual baselines missing: $count"
              echo
              sed 's/^/- /' "$file"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "visual-baseline-missing: none"
          fi
      - name: Upload the visual baselines that were missing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-missing
          path: frontend/test-results/visual-baselines-missing.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  quality-gates:
    name: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.10
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Install the gate tools
        run: pip install -r scripts/requirements-ci.txt
      - name: Run every quality gate
        run: python scripts/ci/quality_gates.py --report ci-out/quality-gates/report.md
      - name: Upload the quality gates report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-gates-report
          path: ci-out/quality-gates/
          if-no-files-found: ignore
          retention-days: 14

  claude-review:
    name: claude-review
    needs: [build, frontend-unit, e2e, quality-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The only job that may write to the pull request, and only to post the review comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.11.0
      - name: Install the pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.311
      # The key is in the environment of this step only. A GitHub token is never given to it. Event values arrive
      # through env, never as an expression inside the script.
      - name: Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PF_REVIEW_MAX_BUDGET_USD: ${{ vars.PF_REVIEW_MAX_BUDGET_USD }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              event=pull_request
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              event=push
              base="$PUSH_BEFORE_SHA"
              head="$GITHUB_SHA"
              ;;
            *)
              event=manual
              base=""
              head="$GITHUB_SHA"
              ;;
          esac
          python3 scripts/ci/claude_review.py run --base "$base" --head "$head" --event "$event" --out ci-out/review
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/claude_review.py comment --platform github --report ci-out/review/claude-review.md
      - name: Upload the review report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review
          path: ci-out/review/
          if-no-files-found: ignore
          retention-days: 14
